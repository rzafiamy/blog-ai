version: '3.8'

services:
  app:
    build:
      context: .
      target: ${ENV:-development}
    ports:
      - "5000"
    volumes:
      - ./src/backend:/app
      - ./src/frontend/static:/app/static
      - ./src/frontend/templates:/app/templates
    environment:
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - JWT_READ_TOKEN=${JWT_READ_TOKEN}
      - JWT_EDIT_TOKEN=${JWT_EDIT_TOKEN}
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./src/backend:/app
      - ./src/frontend/static:/app/static
      - ./src/frontend/templates:/app/templates
