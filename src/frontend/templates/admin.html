<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            futuristic: '#00FFB2',
            darkbg: '#0D0F11',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-darkbg text-white">
  <div class="max-w-3xl mx-auto p-10">
    <h1 class="text-3xl font-bold text-futuristic mb-8">🛠 Admin Panel</h1>

    <form id="post-form" class="space-y-4 bg-gray-800 p-6 rounded shadow-lg">
      <input type="text" id="title" placeholder="Post Title" class="w-full p-3 bg-gray-700 rounded text-white focus:outline-none"/>
      <input type="text" id="author" placeholder="Author" class="w-full p-3 bg-gray-700 rounded text-white focus:outline-none"/>
      <input type="text" id="category" placeholder="Category" class="w-full p-3 bg-gray-700 rounded text-white focus:outline-none"/>
      <input type="text" id="section" placeholder="Section" class="w-full p-3 bg-gray-700 rounded text-white focus:outline-none"/>
      <textarea id="content" placeholder="Content (Markdown)" class="w-full p-3 h-40 bg-gray-700 rounded text-white focus:outline-none"></textarea>
      <input type="file" id="media" accept="image/*,video/*" class="w-full text-sm text-gray-400"/>
      <button type="submit" class="w-full bg-futuristic text-gray-900 font-bold py-2 rounded hover:opacity-90">💾 Save Post</button>
    </form>

    <div id="post-list" class="mt-10 space-y-4"></div>
  </div>

  <script src="/static/js/admin.js"></script>
</body>
</html>
