<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Futuristic Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            futuristic: '#00B289',
            lightbg: '#F8FAFC',
            headerbg: '#FFFFFF',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-lightbg text-gray-900 font-sans">
  <div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-headerbg border-b border-gray-200 px-6 py-4">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <h1 class="text-3xl font-bold text-futuristic tracking-wide"><a href="/">Futuristic Blog</a></h1>
        <nav class="space-x-4 text-futuristic text-base">
          <a href="/" class="hover:underline">Home</a>
          <a href="/admin" class="hover:underline">Admin</a>
        </nav>
      </div>
    </header>

    <!-- Search & Filters (Sticky inside content) -->
    <div class="w-full border-b border-gray-200 bg-lightbg sticky top-0 z-40">
      <div class="flex flex-col items-center justify-center w-full max-w-4xl mx-auto px-4 py-6 space-y-4">
        <input id="search-input" type="text" placeholder="🔍 Search posts..."
               class="w-full md:w-2/3 p-3 bg-white text-gray-800 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-futuristic" />
        <div id="category-buttons" class="flex flex-wrap justify-center gap-3"></div>
      </div>
    </div>
    

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto">
      <section id="category-grid"></section>

      <div class="flex justify-between mt-10 text-futuristic">
        <a id="prev-post" href="#" class="hover:underline">⬅ Previous</a>
        <a id="next-post" href="#" class="hover:underline">Next ➡</a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white text-center text-futuristic p-4 border-t border-gray-200">
      &copy; 2025 Futuristic Blog — All rights reserved.
    </footer>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
